name: Outreach

on:
  workflow_dispatch:
    inputs:
      file:
        required: true

permissions:
  contents: read

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_READ }}
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ops/outreach-box
          token: ${{ secrets.SOURCE_READ }}
          path: box
          persist-credentials: false
      - env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: python3 -I src/deploy/data-repo/outreach-key.py env
      - env:
          FILE: ${{ inputs.file }}
          BOX: box
        run: bash src/deploy/data-repo/outreach.sh

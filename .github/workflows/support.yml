name: Support

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [waiting, reply-ticket, reply-chat, reply-mail, close-ticket, done]
        default: waiting
      target:
        required: false
      file:
        required: false

permissions:
  contents: read

concurrency:
  group: support
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_READ }}
          path: src
          persist-credentials: false
      - id: box
        if: ${{ inputs.file != '' }}
        run: |
          r="$(sed -n 's/^support=//p' src/deploy/data-repo/boxes.txt)"
          [ -n "$r" ] || { echo "::error::no box"; exit 1; }
          echo "::add-mask::$r"
          echo "ref=$r" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.file != '' }}
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ steps.box.outputs.ref }}
          token: ${{ secrets.SOURCE_READ }}
          path: box
          persist-credentials: false
      - env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: bash src/deploy/data-repo/go.sh 33 env
      - env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          FILE: ${{ inputs.file }}
          BOX: box
        run: bash src/deploy/data-repo/go.sh 34

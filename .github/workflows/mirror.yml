name: Mirror

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Albatrossvpn/albatross-app
          token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
          path: src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/mirror.sh

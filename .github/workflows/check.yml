name: Check

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: [Update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.SOURCE_REPO }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.SOURCE_REPO }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN || secrets.SOURCE_REPO }}
      SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: git clone -q --depth 1 "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" src > /dev/null 2>&1 && git -C src remote set-url origin "https://github.com/${SOURCE_REPO}.git"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/go.sh 12

  end:
    needs: run
    if: always() && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cleanup.yml -R "$GITHUB_REPOSITORY" -f run="$GITHUB_RUN_ID" > /dev/null 2>&1 || true

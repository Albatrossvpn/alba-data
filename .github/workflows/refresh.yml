name: Refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      S: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Albatrossvpn/Albatross
          token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/discover.sh

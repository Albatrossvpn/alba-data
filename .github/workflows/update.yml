name: Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_SERVERS: ${{ secrets.OWN_SERVERS }}
      OWN_RELAYS: ${{ secrets.OWN_RELAYS }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
      GLOBALPING_TAGS: ${{ secrets.GLOBALPING_TAGS }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Albatrossvpn/Albatross
          token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/collect.sh
      - if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref "${GITHUB_REF_NAME}" -R "${{ github.repository }}" >/dev/null || true

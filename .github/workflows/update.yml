name: Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/read.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: read-${{ matrix.shard }}
          path: src/sealed/read-${{ matrix.shard }}.tar.gpg
          retention-days: 1
          if-no-files-found: error

  run:
    needs: read
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_SERVERS: ${{ secrets.OWN_SERVERS }}
      OWN_RELAYS: ${{ secrets.OWN_RELAYS }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
      GLOBALPING_TAGS: ${{ secrets.GLOBALPING_TAGS }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      READ_SEALED: ${{ github.workspace }}/read
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: read-*
          path: read
          merge-multiple: true
      - run: bash src/deploy/data-repo/collect.sh
      - if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml --ref "${GITHUB_REF_NAME}" -R "${{ github.repository }}" >/dev/null || true
          gh workflow run check.yml --ref "${GITHUB_REF_NAME}" -R "${{ github.repository }}" >/dev/null || true
          gh workflow run sample.yml --ref "${GITHUB_REF_NAME}" -R "${{ github.repository }}" >/dev/null || true

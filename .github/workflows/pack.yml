name: Pack

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - run: bash src/deploy/data-repo/probe.sh build
      - env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: bash src/deploy/data-repo/probe.sh publish

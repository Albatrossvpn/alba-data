name: Watch

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash src/deploy/data-repo/watch.sh

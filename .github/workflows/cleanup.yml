name: Cleanup

on:
  workflow_run:
    workflows: [Update, Refresh, Release, Announce, Wrap, Deploy, Mirror, Check, Tally, Roster, Rig, Pack, Meter, Support, Support key, Outreach, Outreach key, Stock, Gauge, Hosts, Sample, Relay key, Share, Watch, Sieve, Crossing, Commit identities, Buoy]
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      run:
        required: false
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup-${{ github.event.workflow_run.id || inputs.run || 'sweep' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id || inputs.run }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          NAME: ${{ github.event.workflow_run.name }}
          SELF: ${{ github.run_id }}
        run: |
          set +e
          del_run() { gh api -X DELETE "repos/$R/actions/runs/$1" >/dev/null 2>&1 || gh api -X DELETE "repos/$R/actions/runs/$1/logs" >/dev/null 2>&1; }
          sweep=1
          case "$RUN" in *[!0-9]*) RUN="" ;; esac
          if [ -n "$RUN" ] && [ -z "$RESULT" ]; then
            sweep=0 errs=0 st=""
            for _ in $(seq 60); do
              if IFS='|' read -r st RESULT NAME < <(gh api "repos/$R/actions/runs/$RUN" --jq '.status + "|" + (.conclusion // "") + "|" + .name' 2>/dev/null); then
                errs=0
                [ "$st" = completed ] && break
              else
                errs=$((errs + 1))
                [ "$errs" -lt 3 ] || break
              fi
              sleep 5
            done
            [ "$st" = completed ] || RUN=""
          fi
          if [ -n "$RUN" ]; then
            gh api "repos/$R/actions/runs/$RUN/artifacts" --jq '.artifacts[].id' 2>/dev/null |
              while read -r a; do gh api -X DELETE "repos/$R/actions/artifacts/$a" >/dev/null 2>&1; done
            gh api --paginate "repos/$R/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key | contains(\"-$RUN-\")) | .id" 2>/dev/null |
              while read -r c; do gh api -X DELETE "repos/$R/actions/caches/$c" >/dev/null 2>&1; done
            if [ "$RESULT" = success ] || [ "$NAME" = Sample ]; then
              if [ "$NAME" = Update ]; then
                gh api -X DELETE "repos/$R/actions/runs/$RUN/logs" >/dev/null 2>&1
              else
                del_run "$RUN"
              fi
            fi
          fi
          if [ "$sweep" = 1 ]; then
            day="$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)"
            hour="$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)"
            gh api --paginate "repos/$R/actions/workflows?per_page=100" --jq '.workflows[].id' 2>/dev/null |
              while read -r w; do
                gh api --paginate "repos/$R/actions/workflows/$w/runs?per_page=100&status=completed" \
                  --jq ".workflow_runs[] | select(.updated_at < \"$hour\") | .id" 2>/dev/null
              done | sort -u |
              while read -r id; do [ "$id" != "$SELF" ] && del_run "$id"; done
            gh api --paginate "repos/$R/actions/caches?per_page=100" --jq ".actions_caches[] | select(.last_accessed_at < \"$day\") | .id" 2>/dev/null |
              while read -r c; do gh api -X DELETE "repos/$R/actions/caches/$c" >/dev/null 2>&1; done
            live=" $(for st in waiting in_progress queued pending requested action_required; do
              gh api --paginate "repos/$R/actions/runs?status=$st&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null
            done | sort -u | tr '\n' ' ') "
            three="$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)"
            gh api --paginate "repos/$R/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.workflow_run.id // 0) \(.name) \(.created_at)"' 2>/dev/null |
              while read -r a run name at; do
                case "$live" in *" $run "*) continue ;; esac
                case "$name" in android-apk | setup | signed-apk | desktop-linux | desktop-macos | stock) [[ "$at" > "$three" ]] && continue ;; esac
                gh api -X DELETE "repos/$R/actions/artifacts/$a" >/dev/null 2>&1
              done
            fortnight="$(date -u -d '-14 days' +%Y-%m-%dT%H:%M:%SZ)"
            gh api --paginate "repos/$R/releases?per_page=100" --jq ".[] | select(.draft and (.tag_name | startswith(\"test-\")) and .created_at < \"$fortnight\") | .id" 2>/dev/null |
              while read -r d; do gh api -X DELETE "repos/$R/releases/$d" >/dev/null 2>&1; done
          fi
          echo done

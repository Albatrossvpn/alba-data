name: Hosts

on:
  workflow_dispatch:
    inputs:
      task:
        required: true
        default: check

permissions:
  contents: read

concurrency:
  group: hosts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SRV_US_HOST: ${{ secrets.SRV_US_HOST }}
      SRV_US_PASS: ${{ secrets.SRV_US_PASS }}
      SRV_FRA_HOST: ${{ secrets.SRV_FRA_HOST }}
      SRV_FRA_PASS: ${{ secrets.SRV_FRA_PASS }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/hosts.sh

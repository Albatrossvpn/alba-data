name: Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
      release:
        description: Publish a release with this version (e.g. 1.2.0); empty only builds and tests
        required: false
      force_update:
        description: Older versions stop until updated
        type: boolean
        default: true
      update_message:
        description: Shown with the update
        required: false
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ inputs.release != '' && format('release-{0}', inputs.release) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: ${{ inputs.ref }}
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/backend-1.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/backend-2.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/backend-3.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/backend-4.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/backend-5.sh"
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: ${{ inputs.ref }}
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-1.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-2.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-3.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-4.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-5.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-6.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-7.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/test-8.sh"
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: ${{ inputs.ref }}
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - id: version
      env:
        RELEASE: ${{ inputs.release }}
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-1.sh"
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-2.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-3.sh"
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-4.sh"
    - env:
        VERSION: ${{ steps.version.outputs.version }}
        RELEASE: ${{ inputs.release }}
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-5.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/build-6.sh"
    - uses: actions/cache/save@v6
      with:
        key: folder-${{ github.run_id }}-${{ github.run_attempt }}
        path: sealed/folder.tar.gpg
        enableCrossOsArchive: true
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: ${{ inputs.ref }}
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-1.sh"
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-2.sh"
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-3.sh"
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-4.sh"
    - timeout-minutes: 55
      env:
        RELEASE: ${{ inputs.release }}
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-5.sh"
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-6.sh"
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/cache/save@v6
      with:
        key: android-${{ github.run_id }}-${{ github.run_attempt }}
        path: sealed/android.tar.gpg
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-7.sh"
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/android-8.sh"
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash build/android/selftest.sh
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash build/android/selftest.sh
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 23
        arch: x86_64
        target: google_apis
        disk-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash build/android/selftest.sh
  installer:
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: ${{ inputs.ref }}
    - uses: actions/cache/restore@v6
      with:
        key: folder-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: folder-${{ github.run_id }}-
        path: sealed/folder.tar.gpg
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/installer-1.sh"
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-2.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-3.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-4.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
      continue-on-error: true
      timeout-minutes: 12
      shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-5.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-6.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-7.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - shell: pwsh
      run: '& "$env:GITHUB_WORKSPACE/deploy/data-repo/steps/installer-8.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: bash "$GITHUB_WORKSPACE/deploy/data-repo/steps/installer-9.sh"
    - if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/cache/save@v6
      with:
        key: setup-${{ github.run_id }}-${{ github.run_attempt }}
        path: sealed/setup.tar.gpg
        enableCrossOsArchive: true
  release-assets:
    needs:
    - backend
    - test
    - build
    - installer
    - android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OWN_KEY: ${{ secrets.OWN_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      DOMESTIC_MIRROR: ${{ secrets.DOMESTIC_MIRROR }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: Albatrossvpn/albatross-app
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        ref: main
        path: repo
    - uses: actions/cache/restore@v6
      with:
        key: android-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: android-${{ github.run_id }}-
        path: sealed/android.tar.gpg
        fail-on-cache-miss: true
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/repo/deploy/data-repo/steps/release-assets-1.sh"
    - uses: actions/cache/restore@v6
      with:
        key: setup-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: setup-${{ github.run_id }}-
        path: sealed/setup.tar.gpg
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/repo/deploy/data-repo/steps/release-assets-2.sh"
    - env:
        CTX0: ${{ needs.build.outputs.version }}
      shell: bash
      run: bash "$GITHUB_WORKSPACE/repo/deploy/data-repo/steps/release-assets-3.sh"
    - uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
        tag_name: v${{ needs.build.outputs.version }}
        target_commitish: ${{ needs.build.outputs.sha }}
        body: |
          Android: one APK for 64-bit phones, Android 6 and newer. If you have 0.3.1 or older, uninstall it before installing this version (one time only). Later updates install over it.
        fail_on_unmatched_files: true
        files: |
          Albatross-*-android.apk
          dist/Albatross-Setup-*.exe
        repository: Albatrossvpn/albatross-app
    - uses: actions/setup-go@v7
      with:
        go-version-file: repo/go.mod
        cache-dependency-path: repo/go.sum
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: repo/backend/package-lock.json
    - shell: bash
      run: bash "$GITHUB_WORKSPACE/repo/deploy/data-repo/steps/release-assets-4.sh"
    - env:
        VERSION: ${{ needs.build.outputs.version }}
        FORCE: ${{ inputs.force_update }}
        MESSAGE: ${{ inputs.update_message }}
      shell: bash
      run: bash "$GITHUB_WORKSPACE/repo/deploy/data-repo/steps/release-assets-5.sh"

name: Share

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: share
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.SOURCE_REPO }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.SOURCE_REPO }}
      OWN_SERVERS: ${{ secrets.OWN_SERVERS || secrets.SOURCE_REPO }}
      OWN_RELAYS: ${{ secrets.OWN_RELAYS || secrets.SOURCE_REPO }}
      SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
    steps:
      - env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: git clone -q --depth 1 "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" src > /dev/null 2>&1 && git -C src remote set-url origin "https://github.com/${SOURCE_REPO}.git"
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/go.sh 30

  end:
    needs: run
    if: always() && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cleanup.yml -R "$GITHUB_REPOSITORY" -f run="$GITHUB_RUN_ID" > /dev/null 2>&1 || true

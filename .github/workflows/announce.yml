name: Announce
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
      force_update:
        type: boolean
        default: true
      update_message:
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ secrets.SOURCE_REPO }}
        token: ${{ secrets.SOURCE_READ }}
        ref: main
        path: trusted
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: trusted/go.mod
        cache: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
        package-manager-cache: false
    - run: bash trusted/deploy/data-repo/release.sh deps
    - env:
        SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        ADMIN_USER: ${{ secrets.ADMIN_USER }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        VERSION: ${{ inputs.version }}
        FORCE: ${{ inputs.force_update }}
        MESSAGE: ${{ inputs.update_message }}
      run: bash trusted/deploy/data-repo/release.sh announce

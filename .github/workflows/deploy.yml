name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      SITE_NAME: ${{ secrets.SITE_NAME }}
      COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
      COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Albatrossvpn/albatross-app
          token: ${{ secrets.SOURCE_TOKEN || secrets.MYALBA }}
          ref: ${{ inputs.ref }}
          path: src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash src/deploy/data-repo/deploy.sh
